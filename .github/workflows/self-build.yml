name: Self-build

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default latest stable)
        required: false
      release:
        description: Publish a new build even if this upstream release is already built (ships new commits on this branch)
        type: boolean
        default: false
  # A merged conflict-resolution PR moves its source branch to the result and releases it.
  pull_request:
    types: [closed]
    branches: ["upstream/**"]

# One queue for builds and adoptions; queue: max keeps every pending run instead of only the newest.
concurrency:
  group: self-build
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/self-build.yml/enable"

      # Fork builds of upstream X.Y.Z are versioned X.Y.(Z*100+N), so each new
      # build of the same upstream release is still a newer version to the updater.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          upstream_latest="$(gh release view --repo pingdotgg/t3code --json tagName --jq .tagName)"
          tag="${INPUT_TAG:-$upstream_latest}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$tag is not a stable X.Y.Z release" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" first=$(( BASH_REMATCH[3] * 100 ))
          last=-1
          existing_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          for existing in $existing_tags; do
            if [[ "$existing" =~ ^v${major}\.${minor}\.([0-9]+)$ ]]; then
              n=$(( BASH_REMATCH[1] - first ))
              if (( n >= 0 && n < 100 && n > last )); then last=$n; fi
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "resolve/$GITHUB_REF_NAME/$tag" --state open --json number --jq '.[].number')"
          if [[ -n "$open_pr" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag waits for its conflict-resolution PR (resolve/$GITHUB_REF_NAME/$tag)"
            exit 0
          fi
          echo "latest=$([[ "$tag" == "$upstream_latest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if (( last >= 0 )) && [[ "$RELEASE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already built as $major.$minor.$(( first + last ))"
            exit 0
          fi
          if (( last >= 99 )); then
            echo "$tag already has 100 fork builds" >&2
            exit 1
          fi
          version="$major.$minor.$(( first + last + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "building $tag as $version"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      T3_SELF_SIGN_IDENTITY: ${{ vars.SELF_SIGN_IDENTITY }}
    steps:
      # The branch tip, not the queued event's SHA: an adoption may have moved it meanwhile.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply self-build commits onto the upstream release
        env:
          GH_TOKEN: ${{ secrets.SELF_BUILD_TOKEN }}
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main "refs/tags/$TAG:refs/tags/upstream-$TAG"
          base="$(git merge-base HEAD upstream/main)"
          if ! git merge-base --is-ancestor "$base" "upstream-$TAG"; then
            echo "$TAG is older than this branch's upstream base $base" >&2
            exit 1
          fi
          git config user.name self-build
          git config user.email self-build@localhost
          source_sha="$(git rev-parse HEAD)"
          if ! git rebase --onto "upstream-$TAG" "$base"; then
            conflicted="" unsupported="" steps=0
            while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
              if (( ++steps > 500 )); then echo "::error::Rebase did not finish" >&2; exit 1; fi
              while IFS= read -r -d '' entry; do
                code="${entry:0:2}" path="${entry:3}"
                if [[ "$code" == UU || "$code" == AA ]] && grep -qE '^<<<<<<< ' -- "$path"; then
                  conflicted+="$path"$'\n'
                else
                  unsupported+="$code $path"$'\n'
                fi
              done < <(git status --porcelain=v1 -z | grep -zE '^(DD|AU|UD|UA|DU|AA|UU) ')
              if [[ -n "$unsupported" ]]; then
                git rebase --abort
                echo "::error::Conflicts without text markers (binary, delete or rename) need a manual fix: ${unsupported//$'\n'/; }" >&2
                exit 1
              fi
              git add -A
              if ! git -c core.editor=true rebase --continue && [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
                git rebase --skip || true
              fi
            done
            files="$(printf '%s' "$conflicted" | sort -u | sed '/^$/d')"
            base_branch="upstream/$TAG" head_branch="resolve/$GITHUB_REF_NAME/$TAG"
            git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
            git -c http.https://github.com/.extraheader= push --force origin "upstream-$TAG^{commit}:refs/heads/$base_branch" "HEAD:refs/heads/$head_branch"
            list="$(printf '%s\n' "$files" | sed 's/^/- `/; s/$/`/')"
            pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$base_branch" --head "$head_branch" \
              --title "Resolve self-build conflicts with $TAG" \
              --body "$(printf '%s\n\n%s\n\n%s\n' \
                "Rebasing \`$GITHUB_REF_NAME\` onto pingdotgg/t3code $TAG conflicted. The conflict markers are committed as-is in:" \
                "$list" \
                "Merging this PR moves \`$GITHUB_REF_NAME\` to the result and publishes a release. source-sha: $source_sha")")"
            gh pr comment "$pr" --body "$(printf '%s\n\n%s\n\n%s\n' \
              "@codex This branch is T3 Code $TAG with this fork's own commits rebased on top (self-signed macOS build, the self-build workflow, the sidebar Done block). The rebase conflicted and the conflict markers were committed as-is in:" \
              "$list" \
              "Resolve every conflict marker in those files so T3's $TAG changes and this fork's changes both keep working. Change nothing else. Then run the type check and the tests next to the files you changed, as AGENTS.md describes, and push the fix to this pull request's branch.")"
            echo "::error::Rebase onto $TAG conflicted in: ${files//$'\n'/ }. Opened $pr for @codex."
            exit 1
          fi
          echo "UPSTREAM_SHA=$(git rev-parse "upstream-$TAG")" >> "$GITHUB_ENV"
          git log --oneline "upstream-$TAG..HEAD"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Import signing certificate
        env:
          SELF_SIGN_P12: ${{ secrets.SELF_SIGN_P12 }}
          SELF_SIGN_P12_PASSWORD: ${{ secrets.SELF_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/self-sign.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/self-sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/self-sign.p12" -k "$keychain" -P "$SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/self-sign.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "T3_SELF_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cp .env.example .env
          vp run dist:desktop:artifact --platform mac --target zip --arch arm64 \
            --build-version "$VERSION" --output-dir "$RUNNER_TEMP/release"

      - name: Verify signature
        run: |
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/verify"
          app="$(ls -d "$RUNNER_TEMP"/verify/*.app)"
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" | grep -F "certificate leaf = H\"$(echo "$T3_SELF_SIGN_IDENTITY" | tr 'A-F' 'a-f')\""
          grep -F "repo: ${GITHUB_REPOSITORY#*/}" "$app/Contents/Resources/app-update.yml"

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --latest="$LATEST" \
            --title "T3 Code $VERSION (self-build of $TAG)" \
            --notes "pingdotgg/t3code $TAG ($UPSTREAM_SHA) with the self-build commits from $GITHUB_REF_NAME." \
            "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP"/release/*.zip.blockmap "$RUNNER_TEMP"/release/latest-mac.yml

  adopt:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'resolve/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Move the source branch to the resolved result and release it
        env:
          PUSH_TOKEN: ${{ secrets.SELF_BUILD_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          rest="${HEAD_REF#resolve/}" tag="${HEAD_REF##*/}"
          source="${rest%/*}"
          source_sha="$(grep -oE 'source-sha: [0-9a-f]{40}' <<<"$PR_BODY" | cut -d' ' -f2)"
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$tag:refs/tags/upstream-$tag"
          added_markers="$(git diff "upstream-$tag" HEAD | grep -E '^\+(<<<<<<<|>>>>>>>)( |$)' || true)"
          if [[ -n "$added_markers" ]]; then
            echo "::error::Conflict markers are still in the merged result" >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -c http.https://github.com/.extraheader= push --force-with-lease="refs/heads/$source:$source_sha" origin "HEAD:refs/heads/$source"
          gh workflow run self-build.yml --repo "$GITHUB_REPOSITORY" --ref "$source" -f tag="$tag"
