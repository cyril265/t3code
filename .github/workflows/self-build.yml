name: Self-build

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default latest stable)
        required: false
      release:
        description: Publish a new build even if this upstream release is already built (ships new commits on this branch)
        type: boolean
        default: false

concurrency:
  group: self-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/self-build.yml/enable"

      # Fork builds of upstream X.Y.Z are versioned X.Y.(Z*100+N), so each new
      # build of the same upstream release is still a newer version to the updater.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          upstream_latest="$(gh release view --repo pingdotgg/t3code --json tagName --jq .tagName)"
          tag="${INPUT_TAG:-$upstream_latest}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$tag is not a stable X.Y.Z release" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" first=$(( BASH_REMATCH[3] * 100 ))
          last=-1
          for existing in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName'); do
            if [[ "$existing" =~ ^v${major}\.${minor}\.([0-9]+)$ ]]; then
              n=$(( BASH_REMATCH[1] - first ))
              if (( n >= 0 && n < 100 && n > last )); then last=$n; fi
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$([[ "$tag" == "$upstream_latest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if (( last >= 0 )) && [[ "$RELEASE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already built as $major.$minor.$(( first + last ))"
            exit 0
          fi
          if (( last >= 99 )); then
            echo "$tag already has 100 fork builds" >&2
            exit 1
          fi
          version="$major.$minor.$(( first + last + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "building $tag as $version"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      T3_SELF_SIGN_IDENTITY: ${{ vars.SELF_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply self-build commits onto the upstream release
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main "refs/tags/$TAG:refs/tags/upstream-$TAG"
          base="$(git merge-base HEAD upstream/main)"
          if ! git merge-base --is-ancestor "$base" "upstream-$TAG"; then
            echo "$TAG is older than this branch's upstream base $base" >&2
            exit 1
          fi
          git -c user.name=self-build -c user.email=self-build@localhost rebase --onto "upstream-$TAG" "$base"
          echo "UPSTREAM_SHA=$(git rev-parse "upstream-$TAG")" >> "$GITHUB_ENV"
          git log --oneline "upstream-$TAG..HEAD"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Import signing certificate
        env:
          SELF_SIGN_P12: ${{ secrets.SELF_SIGN_P12 }}
          SELF_SIGN_P12_PASSWORD: ${{ secrets.SELF_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/self-sign.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/self-sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/self-sign.p12" -k "$keychain" -P "$SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/self-sign.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "T3_SELF_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cp .env.example .env
          vp run dist:desktop:artifact --platform mac --target zip --arch arm64 \
            --build-version "$VERSION" --output-dir "$RUNNER_TEMP/release"

      - name: Verify signature
        run: |
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/verify"
          app="$(ls -d "$RUNNER_TEMP"/verify/*.app)"
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" | grep -F "certificate leaf = H\"$(echo "$T3_SELF_SIGN_IDENTITY" | tr 'A-F' 'a-f')\""
          grep -F "repo: ${GITHUB_REPOSITORY#*/}" "$app/Contents/Resources/app-update.yml"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --latest="$LATEST" \
            --title "T3 Code $VERSION (self-build of $TAG)" \
            --notes "pingdotgg/t3code $TAG ($UPSTREAM_SHA) with the self-build commits from $GITHUB_REF_NAME." \
            "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP"/release/*.zip.blockmap "$RUNNER_TEMP"/release/latest-mac.yml
