name: Self-build

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (default latest stable)
        required: false
      release:
        description: Publish a new build even if this upstream release is already built (ships new commits on this branch)
        type: boolean
        default: false

# queue: max keeps every pending run; runs share the branch and the Codex login, so they go one at a time.
concurrency:
  group: self-build
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/self-build.yml/enable"

      # Fork builds of upstream X.Y.Z are versioned X.Y.(Z*100+N), so each new
      # build of the same upstream release is still a newer version to the updater.
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          upstream_latest="$(gh release view --repo pingdotgg/t3code --json tagName --jq .tagName)"
          tag="${INPUT_TAG:-$upstream_latest}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "$tag is not a stable X.Y.Z release" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" first=$(( BASH_REMATCH[3] * 100 ))
          last=-1
          existing_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')"
          for existing in $existing_tags; do
            if [[ "$existing" =~ ^v${major}\.${minor}\.([0-9]+)$ ]]; then
              n=$(( BASH_REMATCH[1] - first ))
              if (( n >= 0 && n < 100 && n > last )); then last=$n; fi
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$([[ "$tag" == "$upstream_latest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if (( last >= 0 )) && [[ "$RELEASE" != "true" ]]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already built as $major.$minor.$(( first + last ))"
            exit 0
          fi
          if (( last >= 99 )); then
            echo "$tag already has 100 fork builds" >&2
            exit 1
          fi
          version="$major.$minor.$(( first + last + 1 ))"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "building $tag as $version"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    # Environment secrets are read when the job starts, so a queued run sees the login the previous run saved.
    environment: codex
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      LATEST: ${{ needs.resolve.outputs.latest }}
      T3_SELF_SIGN_IDENTITY: ${{ vars.SELF_SIGN_IDENTITY }}
    steps:
      # The branch tip, not the queued event's SHA: an earlier run may have pushed a resolution.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply self-build commits onto the upstream release
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream main "refs/tags/$TAG:refs/tags/upstream-$TAG"
          base="$(git merge-base HEAD upstream/main)"
          if ! git merge-base --is-ancestor "$base" "upstream-$TAG"; then
            echo "$TAG is older than this branch's upstream base $base" >&2
            exit 1
          fi
          git config user.name self-build
          git config user.email self-build@localhost
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if ! git rebase --onto "upstream-$TAG" "$base"; then
            conflicted="" unsupported="" steps=0
            while [[ -d .git/rebase-merge || -d .git/rebase-apply ]]; do
              if (( ++steps > 500 )); then echo "::error::Rebase did not finish" >&2; exit 1; fi
              while IFS= read -r -d '' entry; do
                code="${entry:0:2}" path="${entry:3}"
                if [[ "$code" == UU || "$code" == AA ]] && grep -qE '^<<<<<<< ' -- "$path"; then
                  conflicted+="$path"$'\n'
                else
                  unsupported+="$code $path"$'\n'
                fi
              done < <(git status --porcelain=v1 -z | grep -zE '^(DD|AU|UD|UA|DU|AA|UU) ')
              if [[ -n "$unsupported" ]]; then
                git rebase --abort
                echo "::error::Conflicts without text markers (binary, delete or rename) need a manual fix: ${unsupported//$'\n'/; }" >&2
                exit 1
              fi
              git add -A
              if ! git -c core.editor=true rebase --continue && [[ -z "$(git diff --name-only --diff-filter=U)" ]]; then
                git rebase --skip || true
              fi
            done
            printf '%s' "$conflicted" | sort -u | sed '/^$/d' > "$RUNNER_TEMP/conflicts.txt"
            echo "CONFLICTS=true" >> "$GITHUB_ENV"
            echo "::warning::Rebase onto $TAG conflicted in: $(tr '\n' ' ' < "$RUNNER_TEMP/conflicts.txt")"
          fi
          echo "UPSTREAM_SHA=$(git rev-parse "upstream-$TAG")" >> "$GITHUB_ENV"
          git log --oneline "upstream-$TAG..HEAD"

      - name: Resolve conflicts with Codex
        if: env.CONFLICTS == 'true'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.SELF_BUILD_TOKEN }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6.1-sol' }}
        run: |
          echo "REBASED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          {
            echo "This repository is T3 Code $TAG with this fork's own commits rebased on top (self-signed macOS build, the self-build workflow, the sidebar Done block)."
            echo "The rebase conflicted and the conflict markers were committed as-is in these files:"
            sed 's/^/- /' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve every conflict marker in those files so T3's $TAG changes and this fork's changes both keep working."
            echo "Change nothing else, and do not commit: leave the edits in the working tree."
          } > "$RUNNER_TEMP/codex-prompt.md"
          .github/scripts/self-build-codex.sh "$RUNNER_TEMP/codex-prompt.md"
          left=""
          while IFS= read -r file; do
            if grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- "$file"; then left+="$file "; fi
          done < "$RUNNER_TEMP/conflicts.txt"
          if [[ -n "$left" ]]; then
            echo "::error::Codex left conflict markers in: $left" >&2
            exit 1
          fi
          git add -A
          git commit -m "fix: resolve conflicts with pingdotgg/t3code $TAG" -m "Resolved by Codex ($CODEX_MODEL) in the self-build workflow."
          echo "CHANGED=true" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      # Fork code can break on a new release without any conflict, e.g. when upstream tightens a lint rule.
      - name: Type check, fixing errors with Codex
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          GH_TOKEN: ${{ secrets.SELF_BUILD_TOKEN }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL || 'gpt-6.1-sol' }}
        run: |
          typecheck=(vp run --filter "@t3tools/desktop..." --filter "t3..." typecheck)
          [[ -n "${REBASED_SHA:-}" ]] || echo "REBASED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          for round in 0 1 2; do
            if "${typecheck[@]}" > "$RUNNER_TEMP/typecheck.log" 2>&1; then
              break
            fi
            errors="$(grep -E ': error TS[0-9]+:' "$RUNNER_TEMP/typecheck.log" | sort -u | head -n 200 || true)"
            [[ -n "$errors" ]] || errors="$(tail -n 100 "$RUNNER_TEMP/typecheck.log")"
            printf '%s\n' "$errors"
            if (( round == 2 )); then
              echo "::error::Type check still fails after Codex's fixes" >&2
              exit 1
            fi
            {
              echo "This repository is T3 Code $TAG with this fork's own commits rebased on top."
              echo "Dependencies are installed. \`${typecheck[*]}\` fails with:"
              echo
              printf '%s\n' "$errors"
              echo
              echo "Fix these errors so this fork's changes keep working on top of $TAG, following $TAG's own code where they disagree."
              echo "Change only what the errors need, run the type check yourself if you can, and do not commit: leave the edits in the working tree."
            } > "$RUNNER_TEMP/codex-prompt.md"
            .github/scripts/self-build-codex.sh "$RUNNER_TEMP/codex-prompt.md"
          done
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "fix: build with pingdotgg/t3code $TAG" -m "Fixed by Codex ($CODEX_MODEL) in the self-build workflow."
            echo "CHANGED=true" >> "$GITHUB_ENV"
          fi

      - name: Remove the Codex login
        if: always()
        run: rm -rf "$RUNNER_TEMP/codex-home"

      - name: Save Codex's changes
        if: always() && env.REBASED_SHA != '' && (env.CHANGED == 'true' || failure())
        run: |
          git add -A
          git diff --cached "$REBASED_SHA" > "$RUNNER_TEMP/codex-changes.patch"
          git diff --cached --stat "$REBASED_SHA"

      - uses: actions/upload-artifact@v7
        if: always() && env.REBASED_SHA != '' && (env.CHANGED == 'true' || failure())
        with:
          name: codex-changes
          path: ${{ runner.temp }}/codex-changes.patch
          if-no-files-found: ignore

      - name: Import signing certificate
        env:
          SELF_SIGN_P12: ${{ secrets.SELF_SIGN_P12 }}
          SELF_SIGN_P12_PASSWORD: ${{ secrets.SELF_SIGN_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/self-sign.keychain-db"
          password="$(openssl rand -hex 16)"
          printf '%s' "$SELF_SIGN_P12" | base64 --decode > "$RUNNER_TEMP/self-sign.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/self-sign.p12" -k "$keychain" -P "$SELF_SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          rm "$RUNNER_TEMP/self-sign.p12"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          echo "T3_SELF_SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cp .env.example .env
          vp run dist:desktop:artifact --platform mac --target zip --arch arm64 \
            --build-version "$VERSION" --output-dir "$RUNNER_TEMP/release"

      - name: Verify signature
        run: |
          mkdir "$RUNNER_TEMP/verify"
          ditto -x -k "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP/verify"
          app="$(ls -d "$RUNNER_TEMP"/verify/*.app)"
          codesign --verify --deep --strict "$app"
          codesign -d -r- "$app" | grep -F "certificate leaf = H\"$(echo "$T3_SELF_SIGN_IDENTITY" | tr 'A-F' 'a-f')\""
          grep -F "repo: ${GITHUB_REPOSITORY#*/}" "$app/Contents/Resources/app-update.yml"

      - name: Push the resolved branch
        if: env.CHANGED == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.SELF_BUILD_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:$PUSH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git -c http.https://github.com/.extraheader= push \
            --force-with-lease="refs/heads/$GITHUB_REF_NAME:$SOURCE_SHA" origin "HEAD:refs/heads/$GITHUB_REF_NAME"

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo pingdotgg/t3code --json body --jq .body > "$RUNNER_TEMP/upstream-notes.md"
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "v$VERSION"; } | sort -uV | grep -B1 -x "v$VERSION" | head -1)"
          if [[ "$previous" == "v$VERSION" ]]; then previous=""; fi
          : > "$RUNNER_TEMP/previous-subjects.txt"
          if [[ -n "$previous" ]]; then
            git log --format=%s "$(git merge-base "$previous" upstream/main)..$previous" > "$RUNNER_TEMP/previous-subjects.txt"
          fi
          git log --format=%s "upstream-$TAG..HEAD" \
            | python3 .github/scripts/self-build-release-notes.py "$VERSION" "$TAG" "$RUNNER_TEMP/upstream-notes.md" \
              "$RUNNER_TEMP/previous-subjects.txt" "$previous" \
            > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_REF_NAME" --latest="$LATEST" \
            --title "T3 Code $VERSION (self-build of $TAG)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/*.zip "$RUNNER_TEMP"/release/*.zip.blockmap "$RUNNER_TEMP"/release/latest-mac.yml
